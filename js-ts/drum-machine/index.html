<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Drum Machine</title>
  </head>
  <body>
    <div id="drum-machine">
      <div id="pad-bank"></div>
      <div class="power">
        <p>Power</p>
        <div class="power-control"><div class="power-button power-on"></div></div>
      </div>
      <p id="display"></p>
      <div class="volume">
        <input type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
